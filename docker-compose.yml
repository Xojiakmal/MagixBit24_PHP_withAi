# version: '3.8'

services:


  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: bitrix24-app
    container_name: bitrix24-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - pgsql
      - redis
    networks:
      - bitrix24

  nginx:
    image: nginx:alpine
    container_name: bitrix24-nginx
    restart: unless-stopped
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - bitrix24
    ports:
      - "80:80"

  pgsql:
    image: postgres:16
    container_name: bitrix24-pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bitrix24}
      POSTGRES_USER: ${DB_USERNAME:-bitrix24}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - bitrix24-pgsql:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - bitrix24

  redis:
    image: redis:alpine
    container_name: bitrix24-redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    ports:
      - "6379:6379"
    volumes:
      - bitrix24-redis:/data
    networks:
      - bitrix24

  telethon:
    build:
      context: ./telethon
      dockerfile: Dockerfile
    container_name: bitrix24-telethon
    restart: unless-stopped
    volumes:
      - ./telethon:/app
    environment:
      - API_ID=${TELEGRAM_API_ID}
      - API_HASH=${TELEGRAM_API_HASH}
    networks:
      - bitrix24

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: bitrix24-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - bitrix24

networks:
  bitrix24:
    driver: bridge

volumes:
  bitrix24-pgsql:
  bitrix24-redis:
